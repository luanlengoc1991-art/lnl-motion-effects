<template>
  <style>
@font-face{font-family:"BVP";src:url("assets/fonts/BeVietnamPro-Black.ttf");font-weight:900}
@font-face{font-family:"BVP";src:url("assets/fonts/BeVietnamPro-ExtraBold.ttf");font-weight:800}
@font-face{font-family:"BVP";src:url("assets/fonts/BeVietnamPro-SemiBold.ttf");font-weight:600 700}
@font-face{font-family:"JBM";src:url("assets/fonts/JetBrainsMono.ttf");font-weight:100 800}
#root{position:absolute;inset:0;overflow:hidden}
#fx-wrap{position:absolute;inset:0}
#wd{position:absolute;left:0;right:0;top:420px;text-align:center;white-space:nowrap}
#wd span{display:inline-block;font-family:"BVP";font-weight:900;font-size:200px;color:var(--fg);letter-spacing:-.01em}
#wd span.sp{width:60px}
#wd span.ac{color:var(--accent)}
#sb{position:absolute;left:0;right:0;top:700px;text-align:center;font-family:"JBM";font-weight:700;font-size:34px;letter-spacing:.3em;color:var(--accent)}
  </style>
  <div id="root" data-composition-id="fx" data-width="1920" data-height="1080">
    <div id="fx-wrap">
<div id="wd" data-var-text="tu" data-layout-allow-overlap></div><div id="sb" data-var-text="phu">BẤT ĐỘNG SẢN XANH</div>
    </div>
  </div>
  <script>
    (function () {
const tl = gsap.timeline({ paused: true });
const $ = (s) => document.querySelector("#fx-wrap " + s) || document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll("#fx-wrap " + s));
function rise(sel, t, st = 0.1) { tl.fromTo(sel, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out", stagger: st }, t); }
function pop(sel, t, st = 0.06) { tl.fromTo(sel, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)", stagger: st }, t); }
function count(sel, to, t, d = 1, dec = 0, pre = "", suf = "") { const el = $(sel); const o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = pre + (dec ? o.v.toFixed(dec).replace(".", ",") : Math.round(o.v).toLocaleString("vi-VN")) + suf; } }, t); }
function out(sel, t) { tl.to(sel, { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, t); }
const W="ECO CITY",wd=$("#wd");wd.innerHTML=[...W].map(c=>c===" "?'<span class="sp"> </span>':"<span>"+c+"</span>").join("");
const L=$$("#wd span");
L.forEach((s,i)=>{const a=i*2.4,r=700+((i*137)%300);tl.fromTo(s,{x:Math.cos(a)*r,y:Math.sin(a)*r*.6,rotation:(i%2?1:-1)*(120+i*20),opacity:0,scale:.4},{x:0,y:0,rotation:0,opacity:1,scale:1,duration:1.2,ease:"expo.out"},.2+i*.07);});
L.forEach((s,i)=>tl.set(s,{attr:{class:s.className==="sp"?"sp":"ac"}},2.1+i*.04));
rise("#sb",2.3);
out("#wd,#sb",4.45);
      window.__timelines["fx"] = tl;
    })();
  </script>
</template>

<template>
  <style>

  <script>
    (function () {
const tl = gsap.timeline({ paused: true });

const $$ = (s) => Array.from(document.querySelectorAll("#fx-wrap " + s));

function out(sel, t) { tl.to(sel, { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, t); }
